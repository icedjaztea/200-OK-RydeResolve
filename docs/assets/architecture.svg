<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="930" viewBox="0 0 1120 930" role="img" aria-labelledby="title desc">
<title id="title">RydeResolve architecture and decision workflow</title>
<desc id="desc">Next.js portals call a server-side proxy and FastAPI on Cloud Run, with Firestore and Cloud Storage. Evidence screening routes cases to clarification or review, or through an orchestrator, four concurrent specialists, a Judge, and deterministic policy controls. Eligible cases and human decisions produce simulated receipts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a5194d"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:18px;font-weight:700}.body{font-size:16px;fill:#59505d}.label{font-size:14px;fill:#7b3450}.section{font-size:13px;font-weight:700;letter-spacing:2px;fill:#a5194d}</style>
<rect width="1120" height="930" rx="20" fill="#fcf9fb"/>
<text x="40" y="44" font-size="27" font-weight="700" fill="#24202a">RydeResolve</text>
<text x="40" y="72" class="body">Cloud architecture · Evidence-led decisions · Human review</text>
<text x="40" y="110" class="section">SERVICE ARCHITECTURE</text>
