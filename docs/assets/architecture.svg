<text x="40" y="410" class="section">MAIN ADJUDICATION PATH</text><rect x="40" y="440" width="210" height="115" rx="14" fill="#fff0f5" stroke="#bd1855" stroke-width="1.5"/><text x="60" y="471" class="title" fill="#a91549">Evidence readiness</text><text x="60" y="496" class="body">Safety and routing</text><text x="60" y="519" class="body">Required facts</text><rect x="290" y="440" width="210" height="115" rx="14" fill="#ffffff" stroke="#ddd8dd" stroke-width="1.5"/><text x="310" y="471" class="title" fill="#24202a">Orchestrator</text><text x="310" y="496" class="body">Initial case analysis</text><text x="310" y="519" class="body">Shared policy context</text><rect x="540" y="440" width="250" height="115" rx="14" fill="#ffffff" stroke="#ddd8dd" stroke-width="1.5"/><text x="560" y="471" class="title" fill="#24202a">Four specialists</text><text x="560" y="496" class="body">Rider · Driver</text><text x="560" y="519" class="body">Policy · Fraud</text><rect x="830" y="440" width="250" height="115" rx="14" fill="#ffffff" stroke="#ddd8dd" stroke-width="1.5"/><text x="850" y="471" class="title" fill="#24202a">Judge</text><text x="850" y="496" class="body">Weighs advocates</text><text x="850" y="519" class="body">Proposes an outcome</text><path d="M250 497 H290" fill="none" stroke="#a5194d" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M500 497 H540" fill="none" stroke="#a5194d" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M790 497 H830" fill="none" stroke="#a5194d" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="555" y="578" class="label">Concurrent within runtime limits</text><rect x="830" y="625" width="250" height="115" rx="14" fill="#fff0f5" stroke="#bd1855" stroke-width="1.5"/><text x="850" y="656" class="title" fill="#a91549">Policy controls</text><text x="850" y="681" class="body">Eligibility + validation</text><text x="850" y="704" class="body">Judge consistency</text><rect x="400" y="625" width="320" height="115" rx="14" fill="#ffffff" stroke="#ddd8dd" stroke-width="1.5"/><text x="420" y="656" class="title" fill="#24202a">Clarification / human review</text><text x="420" y="681" class="body">Safety, exceptions, appeals</text><text x="420" y="704" class="body">Reviewer decides the remedy</text><path d="M955 555 V625" fill="none" stroke="#a5194d" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M145 555 V682 H400" fill="none" stroke="#a5194d" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="165" y="671" class="label">Safety / evidence gaps</text><path d="M830 682 H720" fill="none" stroke="#a5194d" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="737" y="667" class="label">Review</text><rect x="830" y="805" width="250" height="80" rx="14" fill="#fff0f5" stroke="#bd1855" stroke-width="1.5"/><text x="850" y="836" class="title" fill="#a91549">Simulated receipt</text><text x="850" y="861" class="body">Recorded case outcome</text><path d="M955 740 V805" fill="none" stroke="#a5194d" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="971" y="777" class="label">Eligible</text><path d="M560 740 V845 H830" fill="none" stroke="#a5194d" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="580" y="831" class="label">Human decision</text><text x="40" y="905" class="body">Safety: advisory summaries only; no Judge ruling. Clarifications return to evidence review.</text></svg>
